<!doctype html>
<html lang="ar" dir="rtl"><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta charset="utf-8">
<title>Agent Office Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A guided tour of the Agent Office skill for Claude">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f6f1e8; --paper:#fffdf8; --ink:#1d2233; --mute:#5d6170; --line:#e3dacb;
  --wood:#d99a4a; --wood-2:#f3dcb4; --accent:#3b55e6; --accent-ink:#fff; --glow:rgba(59,85,230,.35);
  --shade:rgba(16,20,36,.62); --chip:#efe6d6; --ok:#1f8a4c;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-head:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141f; --paper:#191d2b; --ink:#eef0f6; --mute:#a3a8b8; --line:#2b3043;
  --wood:#e7ae5f; --wood-2:#3a2f20; --accent:#7d93ff; --accent-ink:#0d1020; --glow:rgba(125,147,255,.4);
  --shade:rgba(4,6,14,.7); --chip:#232839; --ok:#5fd08f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141f; --paper:#191d2b; --ink:#eef0f6; --mute:#a3a8b8; --line:#2b3043;
  --wood:#e7ae5f; --wood-2:#3a2f20; --accent:#7d93ff; --accent-ink:#0d1020; --glow:rgba(125,147,255,.4);
  --shade:rgba(4,6,14,.7); --chip:#232839; --ok:#5fd08f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.7 var(--f-body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.3}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--wood),var(--wood-2));display:grid;place-items:center;font-weight:700;color:var(--ink);font-family:var(--f-head)}
.brand h1{font-size:1.25rem}
.brand small{display:block;color:var(--mute);font-size:.82rem;line-height:1.3}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.lang button{border:0;background:none;color:var(--mute);padding:6px 14px;font-size:.88rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* stepper */
.stepper{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.chapters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chapters button{border:1px solid var(--line);background:none;color:var(--mute);border-radius:999px;padding:3px 12px;font-size:.82rem}
.chapters button.on{background:var(--chip);color:var(--ink);border-color:transparent;font-weight:600}
.dots{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 4px}
.dots::-webkit-scrollbar{display:none}
.dot{flex:1 0 30px;height:30px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute);font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;position:relative}
.dot.done{background:var(--wood-2);border-color:transparent;color:var(--ink)}
.dot.cur{background:var(--accent);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 4px var(--glow)}
.dot.gap{margin-inline-start:10px}
.prog{height:3px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:18px;margin-top:16px;align-items:start}
.shot{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper);box-shadow:0 18px 40px -24px rgba(0,0,0,.35)}
.shot img{display:block;width:100%;height:auto}
.shot.phone{max-width:300px;margin-inline:auto;border-radius:30px;border:8px solid #0b0d14}
.spot{position:absolute;border-radius:10px;box-shadow:0 0 0 2px var(--accent),0 0 0 9999px var(--shade);transition:all .5s cubic-bezier(.3,.7,.2,1);pointer-events:none}
.spot.none{box-shadow:0 0 0 0 transparent,0 0 0 9999px transparent}
.spot::after{content:"";position:absolute;inset:-6px;border-radius:14px;border:2px solid var(--accent);opacity:0;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(.97)}100%{opacity:0;transform:scale(1.06)}}
.cursor{position:absolute;width:26px;height:26px;transition:all .55s cubic-bezier(.3,.7,.2,1);pointer-events:none;filter:drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.cursor::before{content:"";position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;background:var(--glow);animation:tap 1.6s ease-out infinite}
@keyframes tap{0%{transform:scale(.4);opacity:1}100%{transform:scale(2);opacity:0}}
.cursor[hidden]{display:none}

/* mock screens for the first chapter */
.mock{padding:22px;min-height:420px;display:flex;flex-direction:column;gap:12px;background:
  linear-gradient(180deg,var(--paper),var(--bg))}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;background:var(--chip);font-size:.95rem}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg b{font-weight:600}
.composer{margin-top:auto;display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;background:var(--paper)}
.composer span{flex:1;color:var(--mute);font-size:.9rem;min-width:0}
.send{border:0;background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:6px 14px;font-weight:600}
.qs{display:grid;gap:8px}
.q{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper);flex-wrap:wrap}
.q em{font-style:normal;color:var(--mute);font-size:.88rem}
.q b{font-weight:600}
.pill{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.82rem;background:var(--chip)}
.agents{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ag{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--paper);font-size:.85rem}
.ag b{display:block;font-family:var(--f-head);font-size:.92rem}
.ag span{color:var(--mute)}
.acts{display:flex;gap:8px;margin-top:auto;justify-content:flex-end}
.acts button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:9px;padding:6px 14px}
.acts .yes{background:var(--ok);color:#fff;border-color:transparent;font-weight:600}
.env{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.env div{border:1px dashed var(--line);border-radius:12px;padding:12px;background:var(--paper);font-size:.88rem}
.env b{display:block;font-family:var(--f-head)}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px}
.gal img{border-radius:8px}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem;background:var(--chip);padding:1px 6px;border-radius:5px;direction:ltr;unicode-bidi:isolate}

/* callout */
.callout{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;position:sticky;top:150px;min-width:0}
.callout .kick{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.82rem;letter-spacing:.02em}
.callout .num{background:var(--accent);color:var(--accent-ink);border-radius:7px;padding:0 8px;font-weight:700;font-variant-numeric:tabular-nums}
.callout h2{font-size:1.45rem;margin:8px 0 6px}
.callout p{margin:0 0 10px;color:var(--ink)}
.do{display:flex;gap:10px;align-items:flex-start;background:var(--chip);border-radius:12px;padding:10px 12px;margin:12px 0}
.do .ic{flex:none;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700;margin-top:3px}
.do div{min-width:0}
.do b{display:block;font-size:.78rem;color:var(--mute);font-weight:600;letter-spacing:.03em}
.why{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:6px}
.why li{padding-inline-start:20px;position:relative;font-size:.94rem;color:var(--mute)}
.why li::before{content:"";position:absolute;inset-inline-start:2px;top:.62em;width:8px;height:8px;border-radius:2px;background:var(--wood)}
.nav{display:flex;gap:8px;margin-top:18px;align-items:center}
.nav button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 16px}
.nav .next{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600;margin-inline-start:auto}
.nav button:disabled{opacity:.4;cursor:default}
.hint{color:var(--mute);font-size:.8rem;margin-top:10px}
.foot{margin-top:28px;color:var(--mute);font-size:.85rem;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
.foot a{color:var(--accent)}

@media (max-width:860px){
  .stage{grid-template-columns:1fr}
  .callout{position:static}
  .stepper{position:static}
  .mock{min-height:0;padding:14px}
}
@media (prefers-reduced-motion:reduce){
  .spot,.cursor,.prog i{transition:none}
  .spot::after,.cursor::before{animation:none}
}
img{max-width:100%}[hidden]{display:none!important}</style>

</head><body>
<div class="wrap" id="app">
  <div class="bar">
    <div class="brand"><div class="mark">AO</div><div><h1 data-t="title"></h1><small data-t="sub"></small></div></div>

  <nav class="stepper" aria-label="Tour steps">
    <div class="chapters" id="chapters"></div>
    <div class="dots" id="dots"></div>

      <div class="hint" data-t="keys"></div>

  </section>

  <div class="foot">

</div>

const CUR = '<svg class="cursor" id="cur" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2l15 9-6.5 1.6L9.5 19z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>';
let lang = 'ar', i = 0;
try { lang = localStorage.getItem('tour.lang') || 'ar'; } catch {}
const $ = id => document.getElementById(id);
const shot = $('shot');
const firstOf = {}; S.forEach((s, k) => { if (!(s.ch in firstOf)) firstOf[s.ch] = k; });

function drawStepper(){
  $('chapters').innerHTML = Object.keys(CH).map(c => `<button data-go="${firstOf[c]}" class="${S[i].ch===c?'on':''}">${CH[c][lang]}</button>`).join('');
  $('dots').innerHTML = S.map((s, k) => `<button class="dot ${k<i?'done':''} ${k===i?'cur':''} ${k&&S[k-1].ch!==s.ch?'gap':''}" data-go="${k}" aria-label="${s[lang].h}" ${k===i?'aria-current="step"':''}>${k+1}</button>`).join('');
  $('prog').style.width = (i/(S.length-1)*100)+'%';
  const cur = $('dots').querySelector('.cur'); if (cur) cur.scrollIntoView({block:'nearest', inline:'center'});
}
function place(rect, cpt){
  const spot = shot.querySelector('.spot'), cur = $('cur');
  if (!rect){ spot.classList.add('none'); spot.style.cssText = 'left:50%;top:50%;width:0;height:0'; cur.hidden = true; return; }
  spot.classList.remove('none');
  const [x,y,w,h] = rect, pad = .6;
  const L = Math.max(0, x-pad), T = Math.max(0, y-pad), R = Math.min(100, x+w+pad), B = Math.min(100, y+h+pad);
  spot.style.cssText = `left:${L}%;top:${T}%;width:${R-L}%;height:${B-T}%`;
  const [cx,cy] = cpt || [x+w/2, y+h/2];
  cur.hidden = false; cur.style.left = `calc(${cx}% - 4px)`; cur.style.top = `calc(${cy}% - 2px)`;
}
function rectOf(el){
  const a = shot.getBoundingClientRect(), b = el.getBoundingClientRect();
  return [(b.left-a.left)/a.width*100, (b.top-a.top)/a.height*100, b.width/a.width*100, b.height/a.height*100];
}
function draw(){
  const s = S[i], t = s[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = UI[lang][e.dataset.t]);
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang===lang));
  let inner;
  if (s.img) inner = `<img src="${IMG[s.img]}" alt="${t.h}" width="${s.phone?400:1100}">`;
  else if (s.gal) inner = `<div class="gal">${s.gal.map(g => `<img src="${IMG[g]}" alt="${g}" loading="lazy">`).join('')}</div>`;
  else inner = `<div class="mock">${MOCK[s.mock][lang]}</div>`;
  shot.className = 'shot' + (s.phone ? ' phone' : '');
  shot.innerHTML = inner + '<div class="spot none"></div>' + CUR;
  $('num').textContent = `${i+1} ${UI[lang].of} ${S.length}`;
  $('chap').textContent = CH[s.ch][lang];
  $('h').textContent = t.h; $('p').textContent = t.p; $('do').textContent = t.d;
  $('why').innerHTML = t.w.map(x => `<li>${x}</li>`).join('');
  $('prev').disabled = i===0;
  $('next').textContent = i===S.length-1 ? UI[lang].done : UI[lang].next;
  drawStepper();
  const go = () => { const m = shot.querySelector('[data-spot]'); place(m ? rectOf(m) : s.t, m ? null : s.c); };
  const img = shot.querySelector('img');
  if (img && !img.complete) img.onload = go; else requestAnimationFrame(go);
  try { history.replaceState(null, '', '#s'+(i+1)); } catch {}
}
function goTo(k){ i = (k + S.length) % S.length; draw(); }
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) goTo(+g.dataset.go);
  const l = e.target.closest('[data-lang]'); if (l){ lang = l.dataset.lang; try { localStorage.setItem('tour.lang', lang); } catch {} draw(); }
});
$('next').onclick = () => goTo(i===S.length-1 ? 0 : i+1);
$('prev').onclick = () => goTo(i-1);
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea')) return;
  const fwd = lang==='ar' ? 'ArrowLeft' : 'ArrowRight', back = lang==='ar' ? 'ArrowRight' : 'ArrowLeft';
  if (e.key===fwd && i<S.length-1) goTo(i+1);
  if (e.key===back && i>0) goTo(i-1);
});
addEventListener('resize', () => { const m = shot.querySelector('[data-spot]'); if (m) place(rectOf(m)); });
function fromHash(){ const h = /^#s(\d+)$/.exec(location.hash); if (h) i = Math.min(S.length-1, Math.max(0, h[1]-1)); }
addEventListener('hashchange', () => { const k = i; fromHash(); if (k !== i) draw(); });
fromHash(); draw();
</script>
